version: 2.1

# List of all environment variables accessible in this config file
# https://circleci.com/docs/2.0/env-vars/#built-in-environment-variables

# Recommendations
# ---------------

# General Principles:
#
#  1. Descriptive: The job name should clearly describe what the job does.
#  2. Concise: Names should be as short as possible while still being descriptive.
#  3. Consistent: Use a consistent format or pattern for all job names.
#  4. Avoid Ambiguous Abbreviations: If you use abbreviations, ensure they are widely understood.
#
# Naming Convention Proposal:
#
#  1. Prefixes based on the nature of the job:
#     - build-: for jobs related to building or installation.
#     - lint-: for jobs related to code quality checking.
#     - test-: for jobs related to testing.
#     - security-: for jobs related to security.
#     - metrics-: for jobs related to metrics generation.
#     - deploy-: for jobs related to deployment.
#     - notify-: for jobs related to notifications.
#     - debug-: for jobs related to debugging.
#     - setup-: for jobs related to set up.
#     - init-: for jobs related to initialization.
#     - generate-: for jobs related to generation.
#     - validate-: for jobs related to validation.
#     - compile-: for jobs related to compilation.
#     - e2e-: for jobs related to end-to-end testing.
#
#  2. Suffixes based on the specific tool or task:
#  For example, for a job that uses PHP_CodeSniffer, use phpcs as a suffix.


# Default configuration for persist_to_workspace and attach_workspace commands
persist_to_workspace: &persist_to_workspace
  persist_to_workspace:
    root: .
    paths:
      - .

attach_workspace: &attach_workspace
  attach_workspace:
    # Must be absolute path or relative path from working_directory
    at: ~/project

# This main executor is used by all jobs unless otherwise specified
executors:
  php-executor:
    resource_class: small
    shell: /bin/bash
    docker:
      - name: localhost
        image: cimg/php:8.2
  builder-executor:
    resource_class: small
    shell: /bin/bash
    docker:
      - image: cimg/php:8.2-node
        name: localhost
  simple-executor:
    resource_class: small
    shell: /bin/bash
    docker:
      - image: cimg/base:stable
        name: localhost



jobs:
  debug-info:
    executor: php-executor
    steps:
      - run:
          name: Debug
          command: |
            echo "Current user: $USER"
            echo "Home directory: $HOME"
            echo "Current shell: $SHELL"
            echo "Operating system: $(uname -a)"
            echo "Current path: $PATH"
            echo "Current working directory: $(pwd)"
            echo "Current date: $(date)"
            echo "--------------------"
            env

  build-setup:
    executor: php-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            # "composer.lock" can be used if it is committed to the repo
            - v1-dependencies-{{ checksum "composer.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-
      - run:
          name: Install dependencies
          command: composer install --no-interaction --no-ansi --prefer-dist
      - save_cache:
          paths:
            - ./vendor
          key: v1-dependencies-{{ checksum "composer.json" }}
      - *persist_to_workspace


  lint-phpcs:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Install PHP_CodeSniffer and PHPCompatibility
          command: composer require --dev "squizlabs/php_codesniffer=*" "phpcompatibility/php-compatibility=*"
      - run:
          name: Run PHP_CodeSniffer with Custom Ruleset in the project root
          command: |
            ./vendor/bin/phpcs --standard=phpcs.xml --report-file=phpcs-report.txt --report=checkstyle --extensions=php --ignore=vendor/ .
            result=$?
            if [ $result -eq 1 ] || [ $result -eq 2 ]; then
              exit 0
            else
              exit $result
            fi
      - store_artifacts:
          path: phpcs-report.txt
          destination: phpcs-report



  security-check-dependencies:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Install local-php-security-checker
          command: |
            curl -L -o local-php-security-checker https://github.com/fabpot/local-php-security-checker/releases/download/v2.0.6/local-php-security-checker_2.0.6_linux_amd64
            chmod +x local-php-security-checker
      - run:
          name: Run local-php-security-checker
          command: ./local-php-security-checker --format=json --no-dev > security-report.json
      - store_artifacts:
          path: security-report.json
          destination: security-report



  test-phpunit:
      executor: php-executor
      steps:
        - *attach_workspace
        - run:
            name: Install Infisical CLI
            command: |
              curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
              sudo apt-get update && sudo apt-get install -y infisical
        - run:
            name: Run PHPUnit with Infisical Secrets
            command: |
              export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" --silent --plain)
              infisical run --env=dev --projectId=c6a5c011-fd71-4229-b297-9782e0a67445 -- ./vendor/bin/phpunit --testsuite=Unit

  build-docker-image:
    executor: builder-executor
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build and Push Docker Image to GHCR (GitHub Container Registry)
          command: |
            if [ ! -z "$SKIP_BUILD" ]; then
              echo "Skipping build"
              circleci step halt
              exit 0
            fi

            # Sanitize the repository name and branch name
            REPOSITORY=$(echo "ghcr.io/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" | tr '[:upper:]' '[:lower:]' | tr -d '_')
            TAG=$(echo $CIRCLE_BRANCH | tr '[:upper:]' '[:lower:]' | tr '/' '-' | tr -cd '[:alnum:]._-' | cut -c 1-128)
            # Immutable tag used for deployments
            SHA_TAG=${CIRCLE_SHA1:0:7}

            # Login to GHCR
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            # Build the Docker image
            docker build \
            -f Docker/Dockerfile \
            -t $REPOSITORY:$TAG \
            -t $REPOSITORY:$SHA_TAG \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --build-arg TAG="${TAG}" \
            --build-arg GIT_COMMIT=$(git rev-parse -q --verify HEAD) \
            --build-arg GIT_URL=$(echo ${CIRCLE_REPOSITORY_URL} | sed -e 's/^git@/https:\/\//g' -e 's/\.git$//g' -e 's/:/\//g') \
            --build-arg SQLITE_VERSION=3430200 \
            --build-arg SQLITE_YEAR=2023 \
            --build-arg PROJECT_USERNAME=$CIRCLE_PROJECT_USERNAME \
            .

            # Push the Docker image
            docker push $REPOSITORY:$TAG
            docker push $REPOSITORY:$SHA_TAG

            # "latest" only on main/master
            if [ "$CIRCLE_BRANCH" = "main" ] || [ "$CIRCLE_BRANCH" = "master" ]; then
              docker tag $REPOSITORY:$SHA_TAG $REPOSITORY:latest
              docker push $REPOSITORY:latest
            fi


  deploy-ssh-staging:
    executor: simple-executor
    steps:
      - add_ssh_keys:
          fingerprints:
            - "${STAGING_SSH_FINGERPRINT}"
      - deploy:
          name: Deploy to AWS
          command: |
            set -x
            ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
              "DEPLOY_DIR='$STAGING_DEPLOY_DIRECTORY' BRANCH='$CIRCLE_BRANCH' bash -se" \<<'EOF'
            set -euo pipefail

            PHP_FPM_VERSION=$(php -v | head -n 1 | cut -d ' ' -f 2 | cut -d '.' -f 1-2)

            cd "$DEPLOY_DIR"
            git pull origin "$BRANCH"
            composer install --optimize-autoloader --no-interaction --prefer-dist
            sudo -n service "php${PHP_FPM_VERSION}-fpm" restart
            EOF

  evaluate_code:
      docker:
        - image: cimg/php:8.2
      steps:
        - checkout
        - run:
            name: Installer phploc et phpmetrics
            command: |
              wget https://phar.phpunit.de/phploc.phar -O phploc
              chmod +x phploc
              composer global require phpmetrics/phpmetrics
        - run:
            name: Exécuter phploc
            command: ./phploc src/
        - run:
            name: Exécuter phpmetrics
            command: |
              # Récupère automatiquement le bon chemin du dossier bin de Composer
              GLOBAL_BIN=$(composer global config bin-dir --absolute)
              $GLOBAL_BIN/phpmetrics --report-html=report src/
        - store_artifacts:
            path: report
            destination: phpmetrics-report

            
        
  quality_code:
    docker:
      - image: cimg/php:8.2
    steps:
      - checkout
      - run:
          name: Installer phpmd et php-doc-check
          command: |
            wget -c https://phpmd.org/static/latest/phpmd.phar -O phpmd
            chmod +x phpmd
            composer require --dev niels-de-blaauw/php-doc-check
      - run:
          name: Exécuter phpmd
          command: ./phpmd src/ text cleancode,codesize,naming
      - run:
          name: Exécuter php-doc-check
          command: ./vendor/bin/php-doc-check -d src/

  deploy-ssh-production:
    executor: simple-executor
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:ct7HC/4ij7x7LLT1Qc6NxLIOQqSFyeqB75UV4+NJEfM"
      - run:
          name: Trust the EC2 host key (no StrictHostKeyChecking=no)
          command: |
            mkdir -p ~/.ssh
            # EC2_HOST_KEY = output of `ssh-keyscan -t ed25519 <ip>`, fetched once
            # from a trusted channel and stored in CircleCI
            echo "$EC2_HOST_KEY" >> ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
      - run:
          name: Login to GHCR on the EC2 (read:packages PAT, via stdin)
          command: |
            echo "$GHCR_READ_PAT" | ssh $EC2_USERNAME@$EC2_HOST \
              "docker login ghcr.io -u $GHCR_USERNAME --password-stdin"
      - run:
          name: Deploy the Docker image
          command: |
            REPOSITORY=$(echo "ghcr.io/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" | tr '[:upper:]' '[:lower:]' | tr -d '_')
            IMAGE="$REPOSITORY:${CIRCLE_SHA1:0:7}"

            ssh $EC2_USERNAME@$EC2_HOST "IMAGE=$IMAGE bash -s" \<<'EOF'
            set -euo pipefail
            docker pull "$IMAGE"

            # Remember the current image for rollback
            PREVIOUS=$(docker inspect -f '{{.Config.Image}}' app-php 2>/dev/null || true)

            docker stop app-php 2>/dev/null || true
            docker rm app-php 2>/dev/null || true

            docker run -d --name app-php \
            -p 80:80 \
            --restart unless-stopped \
            --memory 512m --cpus 1 \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /var/run/apache2 \
            --tmpfs /var/lock/apache2 \
            --tmpfs /var/log/apache2 \
            -v /opt/app/database:/var/www/html/database \
            --security-opt no-new-privileges \
            --env-file /opt/app/.env \
            "$IMAGE"

            # Healthcheck
            for i in $(seq 1 10); do
              if curl -fsS http://localhost/ >/dev/null; then
                echo "Deployment OK"
                docker image prune -f
                exit 0
              fi
              sleep 3
            done

            echo "Healthcheck failed, rolling back"
            docker rm -f app-php
            if [ -n "$PREVIOUS" ]; then
              docker run -d --name app-php -p 80:80 --restart unless-stopped "$PREVIOUS"
            fi
            exit 1
            EOF


workflows:
  main_workflow:
    jobs:
      - debug-info
      - build-setup
      - lint-phpcs:
          requires:
            - build-setup
      - security-check-dependencies:
          requires:
            - build-setup
      - test-phpunit:
          requires:
            - build-setup
      - evaluate_code:
          requires:
            - build-setup
      - quality_code:
          requires:
            - build-setup

      # Docker image: built once all checks pass, pushed to GHCR
      - build-docker-image:
          requires:
            - lint-phpcs
            - security-check-dependencies
            - test-phpunit
            - quality_code
          filters:
            branches:
              only:
                - master
                - main
                - develop
                - /^feature\/.*/
                - /^release\/.*/
                - /^hotfix\/.*/
                - /^bugfix\/.*/

      # Staging (release branches)
      - hold-staging:
          type: approval
          requires:
            - build-docker-image
          filters:
            branches:
              only:
                - /^release\/.*/
      - deploy-ssh-staging:
          requires:
            - hold-staging
          filters:
            branches:
              only:
                - /^release\/.*/

      # Production (main / master)
      - hold-production:
          type: approval
          requires:
            - build-docker-image
          filters:
            branches:
              only:
                - main
                - master
      - deploy-ssh-production:
          requires:
            - hold-production
          filters:
            branches:
              only:
                - main
                - master